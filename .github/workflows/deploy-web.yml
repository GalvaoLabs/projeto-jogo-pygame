name: Build and deploy web game

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "game.py"
      - "settings.py"
      - "core/**"
      - "modes/**"
      - "systems/**"
      - "locales/**"
      - "assets/**"
      - "requirements.txt"
      - "tools/build_web.sh"
      - "tools/build_web.py"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build web game
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pygbag>=0.9.3"
          python tools/build_web.py
      - name: Upload itch.io package
        uses: actions/upload-artifact@v4
        with:
          name: startup-tycoon-itch-html5
          path: build/startup-tycoon-itch.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
