name: Build web game for itch.io

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "game.py"
      - "settings.py"
      - "core/**"
      - "modes/**"
      - "systems/**"
      - "locales/**"
      - "assets/**"
      - "requirements.txt"
      - "tools/build_web.py"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itch-html5-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build web game
        run: python tools/build_web.py
      - name: Upload itch.io package
        uses: actions/upload-artifact@v4
        with:
          name: startup-tycoon-itch-html5
          path: build/startup-tycoon-itch.zip
          if-no-files-found: error
          retention-days: 30
